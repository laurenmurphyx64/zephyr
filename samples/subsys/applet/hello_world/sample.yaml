sample:
  name: Applet - Hello World
  description: >
    Demonstrates loading and running a dynamically-loaded ELF (or native)
    applet using the applet subsystem. The applet runs in an isolated memory domain
    (and in user mode when CONFIG_USERSPACE is enabled) without any knowledge of LLEXT,
    memory domains, or userspace internals.

common:
  tags:
    - applet
    - llext
    - userspace
  depends_on: []
  min_ram: 64
  min_flash: 128
  integration_platforms:
    - qemu_cortex_a9
    - qemu_cortex_r5
    - qemu_cortex_a53
    - qemu_x86/atom/virt
    - mps2/an385
    - mps2/an521/cpu0

tests:
  sample.applet.hello_world:
    integration_platforms:
      - native_sim
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Hello world from applet 'hello world' \\(arg=42\\)"
  sample.applet.hello_world.llext:
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Hello world from applet 'hello world' \\(arg=42\\)"
    extra_configs:
      - CONFIG_LLEXT=y
      - CONFIG_LLEXT_HEAP_SIZE=64
